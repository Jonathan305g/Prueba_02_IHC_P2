<rect x="490" y="110" width="438" height="540" class="panel"/><text x="514" y="158" class="h">¿Vaciar tu pedido?</text><text x="514" y="209">Se quitarán todos los productos.</text><text x="514" y="250" class="s">Conservar recibe el foco inicial.</text><rect x="514" y="293" width="390" height="52" class="b"/><text x="630" y="326">Conservar pedido</text><rect x="514" y="370" width="390" height="52" class="btn"/><text x="632" y="403">Sí, vaciar pedido</text><text x="514" y="474" class="s">Escape conserva el contenido.</text><text x="514" y="514" class="s">Si vacía, ofrecer Deshacer dentro</text><text x="514" y="544" class="s">del carrito durante esa edición.</text><text x="514" y="592" class="s">Este diálogo es distinto de confirmar.</text><text x="32" y="732" class="s">CaféU · Boceto de baja fidelidad · Actualización 2.0.1 · No es captura de la aplicación</text></svg>
